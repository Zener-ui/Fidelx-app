name: Build Fidelx Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ""

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install typescript --save-dev

      - name: Build Fidelx web app
        working-directory: frontend
        env:
          VITE_API_URL: https://fidelx-backend.onrender.com/api
          VITE_APP_ROLE: customer
        run: npm run build

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      # Release signing: only used when the FIDELX_* secrets exist. With no
      # secrets this step does nothing and the debug build below still runs.
      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FIDELX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fidelx-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "FIDELX_KEYSTORE_PATH=$RUNNER_TEMP/fidelx-release.jks" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret found; building the debug APK instead."
          fi

      - name: Apply Fidelx Android identity and icon
        working-directory: .
        env:
          FIDELX_KEYSTORE_PASSWORD: ${{ secrets.FIDELX_KEYSTORE_PASSWORD }}
          FIDELX_KEY_ALIAS: ${{ secrets.FIDELX_KEY_ALIAS }}
          FIDELX_KEY_PASSWORD: ${{ secrets.FIDELX_KEY_PASSWORD }}
          FIDELX_VERSION_CODE: ${{ github.run_number }}
        run: bash ./scripts/prepare-android.sh

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: frontend/android
        env:
          FIDELX_KEYSTORE_PASSWORD: ${{ secrets.FIDELX_KEYSTORE_PASSWORD }}
          FIDELX_KEY_ALIAS: ${{ secrets.FIDELX_KEY_ALIAS }}
          FIDELX_KEY_PASSWORD: ${{ secrets.FIDELX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fidelx-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fidelx-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
